[project]
name = "korad-paneel-2"
version = "0.1.0"
description = "Bedieningspaneel voor de Korad KA3005PS (en later andere voedingen), in Qt"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6", "pyserial>=3.5", "pyqtgraph>=0.13"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
